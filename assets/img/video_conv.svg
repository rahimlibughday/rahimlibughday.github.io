<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4655"/>
      <stop offset="100%" stop-color="#b3010f"/>
    </linearGradient>
    <linearGradient id="darkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1a1e"/>
      <stop offset="100%" stop-color="#0d0d0f"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background hexagon plate -->
  <polygon points="256,20 462,138 462,374 256,492 50,374 50,138"
           fill="url(#darkGrad)" stroke="#2a2a2e" stroke-width="4"/>

  <!-- Angular red slash accents -->
  <polygon points="50,138 180,138 90,260 50,260" fill="url(#redGrad)" opacity="0.9"/>
  <polygon points="462,374 332,374 422,252 462,252" fill="url(#redGrad)" opacity="0.9"/>

  <!-- Thin tactical corner lines -->
  <polyline points="70,150 70,110 130,80" fill="none" stroke="#ff4655" stroke-width="4"/>
  <polyline points="442,362 442,402 382,432" fill="none" stroke="#ff4655" stroke-width="4"/>

  <!-- Core monogram: stylized V/C forming a play-triangle -->
  <g filter="url(#glow)">
    <path d="M 175 175 L 256 340 L 337 175 L 295 175 L 256 258 L 217 175 Z"
          fill="#ffffff"/>
    <path d="M 256 175 L 300 175 L 256 265 L 212 175 Z"
          fill="url(#redGrad)"/>
  </g>

  <!-- Small diagonal cut detail bottom -->
  <polygon points="200,355 312,355 292,385 220,385" fill="#ff4655" opacity="0.85"/>

  <!-- Wordmark -->
  <text x="256" y="413" text-anchor="middle" font-family="Arial, sans-serif"
        font-weight="900" font-size="34" letter-spacing="4" fill="#ffffff">
    VIDEO<tspan fill="#ff4655">CONV</tspan>
  </text>
</svg>
