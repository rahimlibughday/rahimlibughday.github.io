<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="mainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e6a8"/>
      <stop offset="100%" stop-color="#0091ff"/>
    </linearGradient>
    <linearGradient id="darkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f1420"/>
      <stop offset="100%" stop-color="#080a12"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g transform="translate(256,256) scale(0.85) translate(-256,-256)">
    <!-- Background circle plate -->
    <circle cx="256" cy="256" r="236" fill="url(#darkGrad)" stroke="#1c2334" stroke-width="4"/>

    <!-- Outer pulse / motion arcs -->
    <path d="M 90 256 A 166 166 0 0 1 200 108" fill="none" stroke="url(#mainGrad)" stroke-width="10" stroke-linecap="round" opacity="0.55"/>
    <path d="M 422 256 A 166 166 0 0 1 312 404" fill="none" stroke="url(#mainGrad)" stroke-width="10" stroke-linecap="round" opacity="0.55"/>

    <!-- Central figure-in-motion monogram (stylized runner forming an M / arrow-up shape) -->
    <g filter="url(#glow)">
      <path d="M 150 340
               L 150 220
               L 200 220
               L 230 300
               L 260 190
               L 310 190
               L 340 320
               L 300 320
               L 282 250
               L 258 335
               L 218 335
               L 196 265
               L 190 340 Z"
            fill="url(#mainGrad)"/>
    </g>

    <!-- Heartbeat / pulse line accent through the middle -->
    <polyline points="130,256 170,256 190,210 215,300 240,230 260,256 382,256"
              fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>

    <!-- Small city-node dots representing the inter-city leaderboard concept -->
    <circle cx="150" cy="150" r="7" fill="#00e6a8"/>
    <circle cx="362" cy="150" r="7" fill="#0091ff"/>
    <circle cx="256" cy="112" r="7" fill="#00e6a8"/>

    <!-- Wordmark -->
    <text x="256" y="452" text-anchor="middle" font-family="Arial, sans-serif"
          font-weight="900" font-size="46" letter-spacing="2" fill="#ffffff">
      Move<tspan fill="#00e6a8">Up</tspan>
    </text>
  </g>
</svg>
